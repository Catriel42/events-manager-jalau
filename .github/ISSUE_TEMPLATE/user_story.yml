name: User Story
description: Define a new feature from a user perspective.
labels: ["type: enhancement"]
body:
  - type: textarea
    id: story
    attributes:
      label: User Story
      placeholder: |
        As a [type of user],
        I want [some goal],
        so that [some reason/benefit].
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] It should do X
        - [ ] It should show Y
        - [ ] Error Z should be handled
    validations:
      required: true
  - type: textarea
    id: technical-notes
    attributes:
      label: Technical Notes
      placeholder: |
        - Database changes: ...
        - Architecture layers: ...
        - Potential risks: ...
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
