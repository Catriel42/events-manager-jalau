services:
  postgres:
    image: postgres:16-alpine
    container_name: event-manager-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  k6:
    image: grafana/k6:latest
    network_mode: host
    volumes:
      - ./k6:/scripts

volumes:
  pgdata:
