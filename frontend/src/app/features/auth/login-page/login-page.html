<div class="min-h-screen bg-[var(--bg-primary)] flex items-center justify-center relative overflow-hidden">
  <!-- Orbes animados de fondo -->
  <div class="absolute inset-0 overflow-hidden">
    <div class="absolute w-[500px] h-[500px] rounded-full bg-blue-500/20 blur-[120px] -top-40 -left-40 animate-pulse">
    </div>
    <div class="absolute w-[400px] h-[400px] rounded-full bg-blue-600/15 blur-[100px] bottom-20 right-20 animate-pulse"
      style="animation-delay: 2s"></div>
  </div>

  <!-- Card glassmorphism -->
  <div class="relative z-10 w-full max-w-md mx-4">
    <div class="bg-[var(--bg-glass)] backdrop-blur-xl border border-[var(--border-color)] rounded-2xl p-8 shadow-2xl">

      <!-- Imagen geométrica abstracta -->
      <div class="mb-6 flex justify-center">
        @if (themeService.theme() === 'dark') {
        <img src="/logo-dark.svg" alt="" class="w-69 h-60">
        } @else {
        <img src="/logo-light.svg" alt="" class="w-69 h-60">
        }
      </div>

      <!-- Header textual -->
      <div class="text-center mb-8">
        <h1 class="text-xl font-medium text-[var(--text-primary)] mb-2">Welcome Back</h1>
        <p class="text-sm text-[var(--text-secondary)]">Sign in to continue</p>
      </div>

      <!-- Botones SSO -->
      <div class="space-y-3 mb-6">
        <button (click)="loginWithGoogle()"
          class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl border border-[var(--border-color)] bg-[var(--bg-tertiary)] hover:bg-blue-500/10 hover:border-blue-500/50 transition-all duration-200 text-[var(--text-primary)] text-sm">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4" />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853" />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05" />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335" />
          </svg>
          Continue with Google
        </button>

        <button (click)="loginWithMicrosoft()"
          class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-xl border border-[var(--border-color)] bg-[var(--bg-tertiary)] hover:bg-blue-500/10 hover:border-blue-500/50 transition-all duration-200 text-[var(--text-primary)] text-sm">
          <svg viewBox="0 0 21 21" width="20" height="20">
            <path fill="#f35325" d="M1 1h9v9H1z" />
            <path fill="#81bc06" d="M11 1h9v9h-9z" />
            <path fill="#05a6f0" d="M1 11h9v9H1z" />
            <path fill="#ffba08" d="M11 11h9v9h-9z" />
          </svg>
          Continue with Microsoft
        </button>
      </div>

      <!-- Footer -->
      <div class="text-center pt-4 border-t border-[var(--border-color)]">
        <p class="text-xs text-[var(--text-subtle)]">
          By signing in, you agree to our <a href="#" class="text-blue-500 hover:underline">Terms</a>
        </p>
      </div>
    </div>
  </div>
</div>
