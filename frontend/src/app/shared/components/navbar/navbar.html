<nav class="sticky top-0 z-50 bg-[var(--bg-glass)] backdrop-blur-xl border-b border-[var(--border-color)]">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
<!-- Logo -->
      <a routerLink="/events" class="flex items-center gap-3 no-underline">
        @if (themeService.theme() === 'dark') {
          <img src="/logo-dark.svg" alt="" class="w-36 h-36">
          } @else {
            <img src="/logo-light.svg" alt="" class="w-36 h-36">
          }
      </a>

      <!-- Actions -->
      <div class="flex items-center gap-3">
        <!-- Theme Toggle -->
        <button (click)="toggleTheme()" class="p-2 rounded-lg hover:bg-white/10 transition-colors" title="Toggle theme">
          @if (themeService.theme() === 'dark') {
            <svg class="w-5 h-5 text-[var(--text-secondary)]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          } @else {
            <svg class="w-5 h-5 text-[var(--text-secondary)]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
          }
        </button>

        @if (authService.isAuthenticated()) {
          <div class="relative">
            <button (click)="toggleDropdown()" class="p-0.5 rounded-full border-2 border-transparent hover:border-blue-500/50 transition-all duration-200">
              @if (authService.currentUser()?.avatar_url) {
                <img [src]="authService.currentUser()?.avatar_url" alt="Avatar" class="w-9 h-9 rounded-full object-cover">
              } @else {
                <div class="w-9 h-9 rounded-full bg-[var(--bg-tertiary)] border border-[var(--border-color)] flex items-center justify-center text-[var(--text-primary)] font-semibold">
                  {{ authService.currentUser()?.full_name?.charAt(0) || 'U' }}
                </div>
              }
            </button>
            
            @if (isDropdownOpen) {
              <div class="fixed inset-0 z-40" (click)="isDropdownOpen = false"></div>
              
              <div class="absolute right-0 mt-2 w-56 bg-[var(--bg-secondary)] backdrop-blur-xl border border-[var(--border-color)] rounded-xl shadow-2xl z-50 overflow-hidden animate-in fade-in scale-95 duration-200">
                <div class="px-4 py-3 border-b border-[var(--border-color)]">
                  <p class="text-[var(--text-primary)] font-medium text-sm truncate">{{ authService.currentUser()?.full_name }}</p>
                  <p class="text-[var(--text-muted)] text-xs truncate">{{ authService.currentUser()?.email }}</p>
                </div>
                
                <div class="py-1">
                  @if (authService.isAdmin()) {
                    <a routerLink="/dashboard" (click)="isDropdownOpen = false" class="block px-4 py-2 text-sm text-[var(--text-secondary)] hover:bg-[var(--bg-tertiary)] hover:text-[var(--text-primary)] transition-colors">
                      Dashboard
                    </a>
                  } @else {
                    <a routerLink="/my-events" (click)="isDropdownOpen = false" class="block px-4 py-2 text-sm text-[var(--text-secondary)] hover:bg-[var(--bg-tertiary)] hover:text-[var(--text-primary)] transition-colors">
                      My Events
                    </a>
                  }
                </div>
                
                <div class="border-t border-[var(--border-color)] py-1">
                  <button (click)="logout()" class="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-red-500/10 hover:text-red-300 transition-colors">
                    Log out
                  </button>
                </div>
              </div>
            }
          </div>
        } @else {
          <a routerLink="/auth/login" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium rounded-lg transition-all duration-200 shadow-lg shadow-blue-500/20">
            Log In
          </a>
        }
      </div>
    </div>
  </div>
</nav>
