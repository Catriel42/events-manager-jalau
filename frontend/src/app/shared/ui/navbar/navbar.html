<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-logo">
      <a routerLink="/events">
        <div class="logo-icon">JU</div>
        <span class="logo-text">Events</span>
      </a>
    </div>

    <div class="navbar-actions">
      @if (authService.isAuthenticated()) {
        <div class="user-menu">
          <button class="avatar-btn" (click)="toggleDropdown()">
            @if (authService.currentUser()?.avatar_url) {
              <img [src]="authService.currentUser()?.avatar_url" alt="User Avatar" class="avatar-img">
            } @else {
              <div class="avatar-placeholder">
                {{ authService.currentUser()?.full_name?.charAt(0) || 'U' }}
              </div>
            }
          </button>
          
          @if (isDropdownOpen) {
            <!-- Backdrop to close dropdown when clicking outside -->
            <div class="dropdown-backdrop" (click)="isDropdownOpen = false"></div>
            
            <div class="dropdown-menu">
              <div class="dropdown-header">
                <p class="user-name">{{ authService.currentUser()?.full_name }}</p>
                <p class="user-email">{{ authService.currentUser()?.email }}</p>
              </div>
              <div class="dropdown-divider"></div>
              
              @if (authService.isAdmin()) {
                <a routerLink="/dashboard" class="dropdown-item" (click)="isDropdownOpen = false">
                  Dashboard
                </a>
              } @else {
                <a routerLink="/my-events" class="dropdown-item" (click)="isDropdownOpen = false">
                  My Events
                </a>
              }
              
              <div class="dropdown-divider"></div>
              <button class="dropdown-item logout-btn" (click)="logout()">
                Log out
              </button>
            </div>
          }
        </div>
      } @else {
        <a routerLink="/auth/login" class="login-btn">Log In</a>
      }
    </div>
  </div>
</nav>
